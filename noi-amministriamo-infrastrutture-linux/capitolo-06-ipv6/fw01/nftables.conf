#!/usr/sbin/nft -f

flush ruleset

define WAN_IF = "eth0"
define LAN_IF = "eth1"
define VLAN10_IF = "eth2.10"
define VLAN20_IF = "eth2.20"

define LAN_NET = 10.77.0.0/24
define VLAN10_NET = 10.77.10.0/24
define VLAN20_NET = 10.77.20.0/24

define LAN6_NET = fd3a:7b4c:2d91:1::/64
define VLAN10_6_NET = fd3a:7b4c:2d91:10::/64
define VLAN20_6_NET = fd3a:7b4c:2d91:20::/64

define DNS_SERVER = 10.77.0.10
define DNS6_SERVER = fd3a:7b4c:2d91:1::10

table inet filter {
    chain input {
        type filter hook input priority 0;
        policy drop;

        iifname "lo" accept

        # DHCP IPv4 sulla WAN
        iifname $WAN_IF udp sport 67 udp dport 68 accept

        # IPv6: Neighbor Discovery e Router Solicitation
        iifname { $LAN_IF, $VLAN10_IF, $VLAN20_IF } \
            icmpv6 type {
                nd-router-solicit,
                nd-neighbor-solicit,
                nd-neighbor-advert
            } counter accept

        # ICMPv6 necessario per error reporting, PMTU e diagnostica
        iifname { $LAN_IF, $VLAN10_IF, $VLAN20_IF } \
            icmpv6 type {
                destination-unreachable,
                packet-too-big,
                time-exceeded,
                parameter-problem,
                echo-request,
                echo-reply
            } counter accept

        ct state invalid drop
        ct state established,related accept

        # ICMP IPv4
        ip protocol icmp accept

        # SSH dalla management LAN IPv4
        iifname $LAN_IF \
            ip saddr $LAN_NET \
            tcp dport 22 accept
    }

    chain forward {
        type filter hook forward priority 0;
        policy drop;

        ct state invalid drop

        # IPv6: segmentazione esplicita VLAN 10 <-> VLAN 20
        iifname $VLAN10_IF \
            oifname $VLAN20_IF \
            ip6 saddr $VLAN10_6_NET \
            ip6 daddr $VLAN20_6_NET \
            counter drop

        iifname $VLAN20_IF \
            oifname $VLAN10_IF \
            ip6 saddr $VLAN20_6_NET \
            ip6 daddr $VLAN10_6_NET \
            counter drop

        ct state established,related accept

        # Management LAN -> Internet
        iifname $LAN_IF \
            oifname $WAN_IF \
            ip saddr $LAN_NET accept

        # VLAN 10 -> DNS centrale IPv4
        iifname $VLAN10_IF \
            oifname $LAN_IF \
            ip saddr $VLAN10_NET \
            ip daddr $DNS_SERVER \
            udp dport 53 accept

        iifname $VLAN10_IF \
            oifname $LAN_IF \
            ip saddr $VLAN10_NET \
            ip daddr $DNS_SERVER \
            tcp dport 53 accept

        # VLAN 20 -> DNS centrale IPv4
        iifname $VLAN20_IF \
            oifname $LAN_IF \
            ip saddr $VLAN20_NET \
            ip daddr $DNS_SERVER \
            udp dport 53 accept

        iifname $VLAN20_IF \
            oifname $LAN_IF \
            ip saddr $VLAN20_NET \
            ip daddr $DNS_SERVER \
            tcp dport 53 accept

        # VLAN 10 -> DNS centrale IPv6
        iifname $VLAN10_IF \
            oifname $LAN_IF \
            ip6 saddr $VLAN10_6_NET \
            ip6 daddr $DNS6_SERVER \
            udp dport 53 counter accept

        iifname $VLAN10_IF \
            oifname $LAN_IF \
            ip6 saddr $VLAN10_6_NET \
            ip6 daddr $DNS6_SERVER \
            tcp dport 53 counter accept

        # VLAN 20 -> DNS centrale IPv6
        iifname $VLAN20_IF \
            oifname $LAN_IF \
            ip6 saddr $VLAN20_6_NET \
            ip6 daddr $DNS6_SERVER \
            udp dport 53 counter accept

        iifname $VLAN20_IF \
            oifname $LAN_IF \
            ip6 saddr $VLAN20_6_NET \
            ip6 daddr $DNS6_SERVER \
            tcp dport 53 counter accept

        # VLAN 10 -> Internet IPv4
        iifname $VLAN10_IF \
            oifname $WAN_IF \
            ip saddr $VLAN10_NET accept

        # VLAN 20 -> Internet IPv4
        iifname $VLAN20_IF \
            oifname $WAN_IF \
            ip saddr $VLAN20_NET accept
    }

    chain output {
        type filter hook output priority 0;
        policy accept;
    }
}

# NAT soltanto IPv4. Nessun NAT66.
table ip nat {
    chain postrouting {
        type nat hook postrouting priority 100;
        policy accept;

        ip saddr $LAN_NET oifname $WAN_IF masquerade
        ip saddr $VLAN10_NET oifname $WAN_IF masquerade
        ip saddr $VLAN20_NET oifname $WAN_IF masquerade
    }
}
