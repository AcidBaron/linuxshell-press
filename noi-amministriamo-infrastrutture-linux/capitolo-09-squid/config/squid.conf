# Squid forward proxy - Linuxshell Press
# Capitolo 9 - configurazione finale validata

# Proxy esplicito
http_port 3128

# Identita del server
visible_hostname proxy01

# Autenticazione Basic NCSA
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwd
auth_param basic realm LAB-LAN Squid Proxy
auth_param basic credentialsttl 2 hours
acl authenticated proxy_auth REQUIRED

# Client e destinazioni
acl lab_net src 10.77.0.0/24
acl blocked_domains dstdomain "/etc/squid/lists/blocked-domains.txt"

# Metodi e porte ammesse
acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443

# Protezioni di base
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Accesso locale al server
http_access allow localhost

# Il proxy e destinato esclusivamente alla LAB-LAN
http_access deny !lab_net

# Prima autenticazione, poi policy
http_access deny !authenticated
http_access deny blocked_domains

# Utenti autenticati della LAB-LAN
http_access allow lab_net authenticated

# Chiusura esplicita
http_access deny all

# Cache
cache_mem 128 MB
cache_dir ufs /var/spool/squid 1024 16 256
