global
    log /dev/log local0
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe_http_https
    bind 0.0.0.0:8080
    bind 0.0.0.0:8443 ssl crt-list /etc/haproxy/certs/crt-list.txt ssl-min-ver TLSv1.2

    acl host_sito1 hdr(host),host_only -i sito1.lab.test
    acl host_sito2 hdr(host),host_only -i sito2.lab.test

    http-request set-header X-Real-IP %[src]
    http-request set-header X-Forwarded-Proto %[ssl_fc,iif(https,http)]
    http-request deny deny_status 404 if !host_sito1 !host_sito2

    use_backend be_sito1 if host_sito1
    use_backend be_sito2 if host_sito2

backend be_sito1
    option forwardfor
    server web01 10.77.0.51:80 check

backend be_sito2
    option forwardfor
    server web01 10.77.0.51:80 check
