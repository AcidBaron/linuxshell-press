server {
    listen 80;
    server_name sito2.lab.test;

    location / {
        proxy_pass http://10.77.0.51;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name sito2.lab.test;

    ssl_certificate     /etc/nginx/tls/sito2.lab.test.crt;
    ssl_certificate_key /etc/nginx/tls/sito2.lab.test.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://10.77.0.51;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
