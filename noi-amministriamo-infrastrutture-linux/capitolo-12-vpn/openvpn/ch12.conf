# Chapter 12 - OpenVPN server on fw01

port 1194
proto udp4
dev tun0
topology subnet

# OpenVPN tunnel network
server 10.99.20.0 255.255.255.0

# PKI
ca /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/fw01-openvpn.crt
key /etc/openvpn/server/fw01-openvpn.key

# ECDH only: no static DH parameter file
dh none

# Protect the TLS control channel
tls-crypt /etc/openvpn/server/tls-crypt.key

# Reject revoked certificates
crl-verify /etc/openvpn/server/crl.pem

# Require certificates intended for TLS clients
remote-cert-tls client

# Modern TLS/data-channel policy
tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM

# LAB-SPECIFIC routes:
# Windows is already directly attached to LAB-LAN.
# Route only the hosts used by the validated Chapter 12 labs.
push "route 10.77.0.10 255.255.255.255"
push "route 10.77.0.20 255.255.255.255"

# Internal DNS
push "dhcp-option DNS 10.77.0.10"

keepalive 10 60
persist-key
persist-tun

user nobody
group nogroup

verb 3
