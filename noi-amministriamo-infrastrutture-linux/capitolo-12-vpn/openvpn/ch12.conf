port 1194
proto udp4
dev tun0
topology subnet

server 10.99.20.0 255.255.255.0

ca /etc/openvpn/server/ca.crt
cert /etc/openvpn/server/fw01-openvpn.crt
key /etc/openvpn/server/fw01-openvpn.key
dh none
tls-crypt /etc/openvpn/server/tls-crypt.key
crl-verify /etc/openvpn/server/crl.pem
remote-cert-tls client

tls-version-min 1.2
data-ciphers AES-256-GCM:AES-128-GCM

# Baseline laboratorio Hyper-V: soltanto infra01 attraversa il tunnel.
push "route 10.77.0.10 255.255.255.255"
push "dhcp-option DNS 10.77.0.10"

# Client remoto reale:
# push "route 10.77.0.0 255.255.255.0"

keepalive 10 60
persist-key
persist-tun

user nobody
group nogroup
verb 3