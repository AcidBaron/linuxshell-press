//
// Capitolo 15 - FreeIPA
// Necessario nella baseline del laboratorio perché infra01 usa globalmente
// "forward only;".
//
// Le query ricorsive per idm.lab.test vengono inoltrate al DNS integrato
// FreeIPA su ipa01.
//

zone "idm.lab.test" {
    type forward;
    forward only;
    forwarders {
        10.77.0.70;
    };
};
