# Capitolo 16 - Active Directory
# Snippet da integrare nei file BIND esistenti di infra01.
# Non e' un file named.conf completo.

# /etc/bind/db.lab.test
dc01.ad         IN A        10.77.0.80
ad              IN NS       dc01.ad.lab.test.

# /etc/bind/db.10.77.0
80              IN PTR      dc01.ad.lab.test.

# /etc/bind/named.conf.local
# Necessario nel laboratorio perche' la configurazione globale usa forward only.
zone "ad.lab.test" {
    type forward;
    forward only;
    forwarders {
        10.77.0.80;
    };
};
