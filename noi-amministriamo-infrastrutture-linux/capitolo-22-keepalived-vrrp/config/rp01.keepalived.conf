global_defs {
    vrrp_version 3
    script_user root
    enable_script_security
}

vrrp_script chk_nginx {
    script "/usr/bin/systemctl is-active --quiet nginx"
    interval 2
    fall 2
    rise 2
    weight 0
}

vrrp_instance VI_NEXTCLOUD {
    state BACKUP
    interface eth0
    virtual_router_id 22
    priority 150
    advert_int 1

    unicast_src_ip 10.77.0.50
    unicast_peer {
        10.77.0.40
    }

    virtual_ipaddress {
        10.77.0.90/24 dev eth0
    }

    track_script {
        chk_nginx
    }
}
