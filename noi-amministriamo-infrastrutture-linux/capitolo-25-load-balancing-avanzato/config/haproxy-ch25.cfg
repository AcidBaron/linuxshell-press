# Capitolo 25 — estratto validato (non sostituisce l'haproxy.cfg completo).
# Aggiungere alla configurazione esistente su rp01.

# Dentro 'global' (una sola volta):
# stats socket /run/haproxy/admin.sock mode 660 level admin

frontend fe_ch25
    bind *:8081
    mode http
    default_backend be_ch25

backend be_ch25
    mode http
    balance leastconn
    option httpchk GET /backend.txt
    http-check expect status 200
    server web_a 10.77.0.101:80 check
    server web_b 10.77.0.150:80 check

# Variante effettivamente collaudata prima della selezione leastconn:
# sostituire esclusivamente 'balance leastconn' con 'balance roundrobin'.
