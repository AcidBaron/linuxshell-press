# Capitolo 25 — blocco da inserire DENTRO il server {} già esistente.
# Virtual host laboratorio: /etc/nginx/sites-available/ch23-ha
# Il file di script CGI deve esistere su ENTRAMBI i nodi.
location = /fibonacci {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /usr/lib/cgi-bin/ch25-fibonacci.py;
    fastcgi_pass unix:/run/fcgiwrap.socket;
}
